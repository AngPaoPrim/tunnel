services:
  - type: web
    name: pao-tunnel-relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://ang.pao.run.place
      - key: TUNNEL_AGENT_TOKEN
        sync: false
      - key: OAUTH_USERNAME
        sync: false
      - key: OAUTH_PASSWORD
        sync: false
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URIS
        value: https://chatgpt.com/connector/oauth/qF7Qqdlytd9q
      - key: OAUTH_DB_PATH
        value: /var/data/oauth.sqlite3
